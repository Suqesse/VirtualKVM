name: Installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.sha }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg-full innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey installation failed" }
          $media = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg-full" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (!$media) { throw "Real FFmpeg executable missing; launcher shims cannot be bundled" }
          $probe = Join-Path $media.DirectoryName 'ffprobe.exe'
          if (!(Test-Path $probe)) { throw "ffprobe missing" }
          "VIRTUALKVM_FFMPEG=$($media.FullName)" >> $env:GITHUB_ENV
          "VIRTUALKVM_FFPROBE=$probe" >> $env:GITHUB_ENV
          $media.DirectoryName >> $env:GITHUB_PATH
      - name: Restore verified macOS media build
        if: runner.os == 'macOS'
        uses: actions/cache/restore@v4
        with:
          path: |
            build/ffmpeg-native/runtime
            build/ffmpeg-native/deps
            build/ffmpeg-native/sources
          key: media-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_ffmpeg_macos.sh', 'scripts/build_media_deps_macos.sh') }}
      - name: Build verified macOS media runtime
        id: media
        if: runner.os == 'macOS'
        run: python scripts/ci_run.py --log build/native-media.log -- bash scripts/build_ffmpeg_macos.sh
      - name: Retain successful macOS media build
        if: always() && runner.os == 'macOS' && steps.media.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            build/ffmpeg-native/runtime
            build/ffmpeg-native/deps
            build/ffmpeg-native/sources
          key: media-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_ffmpeg_macos.sh', 'scripts/build_media_deps_macos.sh') }}
      - name: Install application build dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install pyinstaller
      - name: Validate application
        run: python scripts/ci_run.py --log build/native-validation.log -- python scripts/validate.py
      - name: Build self-contained application
        run: python scripts/ci_run.py --log build/native-package.log -- python scripts/package.py --bundle-ffmpeg
      - name: Compile native installers
        run: python scripts/ci_run.py --log build/native-installers.log -- python scripts/installer.py
      - name: Verify install, offline media, upgrade and uninstall
        run: python scripts/ci_run.py --log build/native-install-check.log -- python scripts/check_installer.py --allow-install
      - name: Upload verified installers
        uses: actions/upload-artifact@v4
        with:
          name: VirtualKVM-installer-${{ matrix.target }}
          path: dist/installers/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-diagnostics-${{ matrix.target }}
          path: |
            build/native-*.log
            build/validation/*
          if-no-files-found: ignore
