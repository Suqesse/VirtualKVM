name: Publish installers

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Require a successful native installer run for this exact commit
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > source-sha.txt
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/installers.yml/runs?per_page=100" > runs.json
          RUN_ID=$(python - <<'PY'
          import json, os
          runs=json.load(open('runs.json'))['workflow_runs']
          source=open('source-sha.txt').read().strip()
          passed=[r for r in runs if r['head_sha']==source and r['conclusion']=='success']
          if not passed: raise SystemExit('Build and validate all native installers for this exact commit before creating a release tag')
          print(max(passed,key=lambda r:r['id'])['id'])
          PY
          )
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts --pattern 'VirtualKVM-installer-*'
      - name: Verify checksums and publish the pilot installers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          root=Path('artifacts')
          folders=list(root.glob('VirtualKVM-installer-*'))
          if len(folders)!=3: raise SystemExit('Expected all three native targets')
          checksums=[]
          reports={}
          for folder in folders:
              report=json.loads((folder/'installation-check.json').read_text())
              if not report or not all(v is True for v in report.values()): raise SystemExit('Native installation validation did not pass')
              reports[folder.name]=report
              for line in (folder/'SHA256SUMS').read_text().splitlines():
                  digest,name=line.split('  ',1)
                  target=folder/name
                  if target.parent!=folder or hashlib.sha256(target.read_bytes()).hexdigest()!=digest: raise SystemExit('Installer checksum mismatch')
                  checksums.append(digest+'  '+name)
          (root/'SHA256SUMS').write_text('\n'.join(checksums)+'\n')
          (root/'installation-checks.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'targets':reports},indent=2)+'\n')
          PY
          mapfile -t FILES < <(find artifacts -type f \( -name '*.exe' -o -name '*.pkg' -o -name '*.dmg' \) | sort)
          test "${#FILES[@]}" -eq 5
          FILES+=("artifacts/SHA256SUMS" "artifacts/installation-checks.json")
          gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "VirtualKVM $GITHUB_REF_NAME — desktop installers" --notes-file packaging/RELEASE_NOTES.md
