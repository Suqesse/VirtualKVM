[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "virtualkvm"
version = "0.2.1"
description = "Encrypted desktop video and input sharing between Windows and macOS"
readme = "README.md"
requires-python = ">=3.11"
# Qt 6.12 macOS binaries require macOS 26; see docs/validation/macos-qt-wheels.json.
dependencies = [
    "cryptography>=44,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography>=44; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "PySide6-Essentials>=6.8,<6.12",
    "PySide6-Addons>=6.8,<6.12",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11"]

[project.scripts]
virtualkvm = "virtualkvm.__main__:main"

[tool.setuptools.packages.find]
include = ["virtualkvm*"]

[tool.setuptools.package-data]
virtualkvm = ["assets/*.svg"]
